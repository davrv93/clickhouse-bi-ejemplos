# Sirve el tablero y pasa /clickhouse/ a ClickHouse: la página y la API quedan en la misma dirección.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /nginx.conf { return 404; }

    location /clickhouse/ {
        access_log off;                 # la URL lleva usuario y clave: que no queden en el registro
        proxy_pass http://clickhouse:8123/;
        proxy_read_timeout 120s;
    }
}
