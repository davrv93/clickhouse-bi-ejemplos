# ClickHouse + tablero + herramientas del curso «Dashboards y BI con IA · ClickHouse».
# Los mismos comandos funcionan en Windows (PowerShell) y en Mac (Terminal):
#   docker compose up -d                                   levanta ClickHouse y el tablero
#   docker compose run --rm herramientas <script.py> …     ejecuta una herramienta (Python ya viene dentro)
#   docker compose down                                    apaga todo; tus datos quedan en el volumen
name: clickhouse-bi

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_USER: ${CH_USER:-taller}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-taller123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"   # deja que tu usuario cree el usuario de solo lectura (video 13)
    ports:
      - "127.0.0.1:${CH_PUERTO:-8123}:8123"        # solo tu máquina: http://127.0.0.1:8123/play
    volumes:
      - datos:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40

  tablero:
    image: nginx:1.28-alpine
    depends_on:
      clickhouse: { condition: service_healthy }
    ports:
      - "127.0.0.1:${TABLERO_PUERTO:-8080}:80"     # http://127.0.0.1:8080
    volumes:
      - ./tablero:/usr/share/nginx/html:ro
      - ./tablero/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  herramientas:
    build: ./herramientas
    profiles: ["herramientas"]                     # no arranca con «up»: se usa con «docker compose run»
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CH_HOST: clickhouse
      CH_USER: ${CH_USER:-taller}
      CH_PASSWORD: ${CH_PASSWORD:-taller123}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      TABLERO_PUERTO: ${TABLERO_PUERTO:-8080}
    volumes:
      - .:/taller

volumes:
  datos:
